site_name: リバースエンジニアリング講座(日本語訳)
site_description: 0xZ0F 氏のリバースエンジニアリング講座の日本語訳
site_url: https://0xff-minusone.github.io/Z0FCourse_ReverseEngineering-ja/
repo_url: https://github.com/0xFF-MinusOne/Z0FCourse_ReverseEngineering-ja
repo_name: Z0FCourse_ReverseEngineering-ja
docs_dir: .site-src
use_directory_urls: false
copyright: >-
  日本語訳。原著: <a href="https://github.com/0xZ0F/Z0FCourse_ReverseEngineering">0xZ0F/Z0FCourse_ReverseEngineering</a>
  / ライセンス: <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0</a>
  / このサイトのソース: <a href="https://github.com/0xFF-MinusOne/Z0FCourse_ReverseEngineering-ja">https://github.com/0xFF-MinusOne/Z0FCourse_ReverseEngineering-ja</a>

theme:
  name: material
  language: ja
  font: false
  logo: assets/minusone-mark.svg
  favicon: assets/minusone-avatar-light.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0xZ0F/Z0FCourse_ReverseEngineering
      name: 原著(0xZ0F/Z0FCourse_ReverseEngineering)
    - icon: fontawesome/brands/github
      link: https://github.com/0xFF-MinusOne/Z0FCourse_ReverseEngineering-ja
      name: このサイトのソース(日本語訳)

